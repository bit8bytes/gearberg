version: "2"

sql:
  - engine: "sqlite"
    queries: "database/queries/sqlite/orgs.sql"
    schema: "database/migrations/sqlite/"
    gen:
      go:
        package: "orgs"
        out: "database/queries/gen/orgs"
        emit_interface: true
        omit_unused_structs: true

  - engine: "sqlite"
    queries: "database/queries/sqlite/org_settings.sql"
    schema: "database/migrations/sqlite/"
    gen:
      go:

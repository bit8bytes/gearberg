name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          args: --fix=false ./...

      - name: Test
        run: go test -shuffle=on -short -tags sqlite -vet=off -race -timeout 15s -covermode=atomic ./...

      - name: Verify modules
        run: go mod verify

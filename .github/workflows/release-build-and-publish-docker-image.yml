name: "Release: Build and Publish Docker Image"

on:
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Generate version
        id: version
        run: echo "version=$(date +%Y.%m.%d)-${{ github.run_number }}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  build-amd64:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-amd64-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix', '**/*.go') }}
          restore-prefixes-first-match: nix-amd64-${{ runner.os }}-
          gc-max-store-size-linux: 5368709120  # 5 GB

      - name: Build Docker image
        run: nix build .#docker-amd64

      - name: Login to ghcr.io
        run: echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push amd64 image
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          docker load < result
          docker tag gearberg:$VERSION ghcr.io/${{ github.repository }}:$VERSION-amd64
          docker push ghcr.io/${{ github.repository }}:$VERSION-amd64

  build-arm64:
    needs: version
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-arm64-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix', '**/*.go') }}
          restore-prefixes-first-match: nix-arm64-${{ runner.os }}-
          gc-max-store-size-linux: 5368709120  # 5 GB

      - name: Build Docker image
        run: nix build .#docker-arm64

      - name: Login to ghcr.io
        run: echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push arm64 image
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          docker load < result
          docker tag gearberg:$VERSION ghcr.io/${{ github.repository }}:$VERSION-arm64
          docker push ghcr.io/${{ github.repository }}:$VERSION-arm64

  release:
    needs: [version, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Login to ghcr.io
        run: echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Create and push multi-arch manifest
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}:$VERSION \
            --tag ghcr.io/${{ github.repository }}:latest \
            ghcr.io/${{ github.repository }}:$VERSION-amd64 \
            ghcr.io/${{ github.repository }}:$VERSION-arm64

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes

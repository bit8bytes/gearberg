# Validates every PR to main: builds the binary and
# the Docker image via Nix to catch broken build before merge.
name: "Pull Request Checks"

on:
  pull_request:
    branches: [main] # Runs only on PRs to main branch to validate the build.
    paths-ignore:
      - 'README.md'
      - 'wiki/**'
  workflow_dispatch:

jobs:
  # nixos/web.nix uses buildGoModule which compiles the Go binary (no separate build job needed)
  # and runs `go test -short` via doCheck = true (no separate test job needed).
  # nixos/web.docker.nix builds the Docker image which includes the compiled binary.
  build-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix', '**/*.go') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5368709120  # 5 GB

      - name: Build binary
        run: nix build .#default

      - name: Build Docker image (amd64)
        run: nix build .#docker-amd64

  build-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-arm64-${{ hashFiles('flake.lock', '**/*.nix', '**/*.go') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-arm64-
          gc-max-store-size-linux: 5368709120  # 5 GB

      - name: Build binary
        run: nix build .#default

      - name: Build Docker image (arm64)
        run: nix build .#docker-arm64


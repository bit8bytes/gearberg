name: "Periodic Security Check"

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: golang/govulncheck-action@v1
